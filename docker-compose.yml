# Local stack (R-NF-4): Postgres 17, the API (+ its River worker) and the BIND mock.
# `make up` (or `docker compose up -d --build --wait`). Values come from .env (copied from
# .env.example by `make up`); every variable has a development default so a fresh clone boots.
name: lenapay

x-api-env: &api-env
  APP_ENV: ${APP_ENV:-development}
  DATABASE_URL: postgres://${POSTGRES_USER:-lenapay}:${POSTGRES_PASSWORD:-lenapay}@postgres:5432/${POSTGRES_DB:-lenapay}?sslmode=disable
  PSP_BASE_URL: http://bind-mock:8090
  HTTP_ADDR: ":8080"

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lenapay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lenapay}
      POSTGRES_DB: ${POSTGRES_DB:-lenapay}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: ./apps/api
    env_file:
      - path: .env
        required: false
    environment:
      <<: *api-env
      MIGRATE_ON_START: "true"
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30

  worker:
    build: ./apps/api
    entrypoint: ["/app/worker"]
    env_file:
      - path: .env
        required: false
    environment: *api-env
    depends_on:
      api:
        condition: service_healthy # the api applied the migrations

  bind-mock:
    build: ./apps/bind-mock
    env_file:
      - path: .env
        required: false
    environment:
      BINDMOCK_HTTP_ADDR: ":8090"
      BINDMOCK_WEBHOOK_URL: http://api:8080/webhooks/psp/transfers
    ports:
      - "${BINDMOCK_PORT:-8090}:8090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
