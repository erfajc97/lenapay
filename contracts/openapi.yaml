    # ---------- payouts
    DestinationType:
      type: string
      enum: [cbu, cvu, alias]
    Destination:
      type: object
      additionalProperties: false
      required: [type, value, accountNumber, holderName, holderCuit, bankName]
      properties:
        type: { $ref: '#/components/schemas/DestinationType' }
        value:
          type: string
          description: What the user typed (CBU, CVU or alias).
        accountNumber:
          type: string
          description: Resolved 22-digit CBU/CVU.
        holderName: { type: string }
        holderCuit: { type: string }
        bankName: { type: string, nullable: true }
    PayoutQuoteRequest:
      type: object
      additionalProperties: false
      required: [accountId, amount, to]
      properties:
        accountId: { type: string, format: uuid }
        amount: { $ref: '#/components/schemas/Money' }
        to: { type: string, minLength: 6, maxLength: 22 }
    PayoutQuote:
      type: object
      additionalProperties: false
      required: [amount, fee, total, destination, availableAfter, rail]
      properties:
        amount: { $ref: '#/components/schemas/Money' }
        fee: { $ref: '#/components/schemas/Money' }
        total: { $ref: '#/components/schemas/Money' }
        destination: { $ref: '#/components/schemas/Destination' }
        availableAfter: { $ref: '#/components/schemas/Money' }
        rail: { $ref: '#/components/schemas/Rail' }
    CreatePayoutRequest:
      type: object
      additionalProperties: false
      required: [accountId, amount, to, concept]
      properties:
        accountId: { type: string, format: uuid }
        amount: { $ref: '#/components/schemas/Money' }
        to: { type: string, minLength: 6, maxLength: 22 }
        concept: { type: string, minLength: 1, maxLength: 140 }
    Rail:
      type: string
      enum: [bank, internal]
      description: |
        `bank`: the money moves through the PSP (BIND). `internal`: on-us, the destination CVU or
        alias is a Lenapay one, so the payout never reaches the bank: it settles instantly as one
        ledger entry once approved (fee per plan, 0 by default) and the receiver sees a credited
        payin of the same rail. Internal transfers between own accounts are `internal` too.
    PayoutStatus:
      type: string
      enum: [pending_approval, approved, sending, settled, failed, rejected, cancelled]
    PayoutEvent:
      type: object
      additionalProperties: false
      required: [fromStatus, toStatus, actorId, reason, createdAt]
      properties:
        fromStatus:
          allOf:
            - $ref: '#/components/schemas/PayoutStatus'
          nullable: true
        toStatus: { $ref: '#/components/schemas/PayoutStatus' }
        actorId: { type: string, format: uuid, nullable: true }
        reason: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    Payout:
      type: object
      additionalProperties: false
      required: [id, accountId, amount, fee, total, destination, concept, status, rail, createdBy, approvedBy, rejectReason, failureCode, events, attachments, createdAt, updatedAt, settledAt]
      properties:
        id: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        rail: { $ref: '#/components/schemas/Rail' }
        amount: { $ref: '#/components/schemas/Money' }
        fee: { $ref: '#/components/schemas/Money' }
        total: { $ref: '#/components/schemas/Money' }
        destination: { $ref: '#/components/schemas/Destination' }
        concept: { type: string }
        status: { $ref: '#/components/schemas/PayoutStatus' }
        createdBy: { type: string, format: uuid }
        approvedBy: { type: string, format: uuid, nullable: true }
        rejectReason: { type: string, nullable: true }
        failureCode: { type: string, nullable: true }
        events:
          type: array
          items: { $ref: '#/components/schemas/PayoutEvent' }
        attachments:
          type: array
          items: { $ref: '#/components/schemas/PayoutAttachment' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        settledAt: { type: string, format: date-time, nullable: true }
    PayoutAttachmentUpload:
      type: object
      additionalProperties: false
      required: [file]
      properties:
        file:
          type: string
          format: binary
          description: PDF, JPEG or PNG, at most 10 MB (the upload body limit).
    PayoutAttachment:
      type: object
      additionalProperties: false
      required: [id, fileName, contentType, sizeBytes, uploadedBy, createdAt]
      properties:
        id: { type: string, format: uuid }
        fileName: { type: string }
        contentType:
          type: string
          enum: [application/pdf, image/jpeg, image/png]
        sizeBytes: { type: integer, format: int64 }
        uploadedBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
    PayoutList:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Payout' }
        nextCursor: { type: string, nullable: true }
    RejectPayoutRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 280 }

    # ---------- movements
    MovementType:
      type: string
      enum: [payin, payout, internal_transfer]
    MovementStatus:
      type: string
      enum: [pending, completed, failed, cancelled]
    MovementDirection:
      type: string
      enum: [in, out]
    Movement:
      type: object
      additionalProperties: false
      required: [id, type, status, direction, accountId, amount, fee, counterparty, concept, refId, rail, createdAt]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/MovementType' }
        rail: { $ref: '#/components/schemas/Rail' }
        status: { $ref: '#/components/schemas/MovementStatus' }
        direction: { $ref: '#/components/schemas/MovementDirection' }
        accountId: { type: string, format: uuid }
        amount: { $ref: '#/components/schemas/Money' }
        fee:
          allOf:
            - $ref: '#/components/schemas/Money'
          nullable: true
        counterparty: { $ref: '#/components/schemas/Counterparty' }
        concept: { type: string, nullable: true }
        refId:
          type: string
          format: uuid
          description: Id of the payin, payout or internal transfer.
        createdAt: { type: string, format: date-time }
    MovementList:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Movement' }
        nextCursor: { type: string, nullable: true }

    # ---------- reconciliation
    ReconciliationRunStatus:
      type: string
      enum: [queued, running, completed, failed]
    ReconciliationRun:
      type: object
      additionalProperties: false
      required: [id, currency, day, status, matchedCount, missingInLedgerCount, missingAtPspCount, pspTotal, ledgerTotal, difference, createdAt, finishedAt]
      properties:
        id: { type: string, format: uuid }
        currency: { $ref: '#/components/schemas/Currency' }
        day: { type: string, format: date }
        status: { $ref: '#/components/schemas/ReconciliationRunStatus' }
        matchedCount: { type: integer, format: int32 }
        missingInLedgerCount: { type: integer, format: int32 }
        missingAtPspCount: { type: integer, format: int32 }
        pspTotal: { $ref: '#/components/schemas/Money' }
        ledgerTotal: { $ref: '#/components/schemas/Money' }
        difference: { $ref: '#/components/schemas/Money' }
        createdAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time, nullable: true }
    ReconciliationRunList:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ReconciliationRun' }
        nextCursor: { type: string, nullable: true }
    ReconciliationItemStatus:
      type: string
      enum: [matched, missing_in_ledger, missing_at_psp]
    ReconciliationItem:
      type: object
      additionalProperties: false
      required: [id, status, providerTransferId, direction, pspAmount, ledgerAmount, createdAt]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/ReconciliationItemStatus' }
        providerTransferId: { type: string }
        direction: { $ref: '#/components/schemas/MovementDirection' }
        pspAmount:
          allOf:
            - $ref: '#/components/schemas/Money'
          nullable: true
          description: The PSP statement amount (null when missing at the PSP).
        ledgerAmount:
          allOf:
            - $ref: '#/components/schemas/Money'
          nullable: true
          description: Our recorded amount (null when missing in the ledger).
        createdAt: { type: string, format: date-time }
    ReconciliationItemList:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ReconciliationItem' }
        nextCursor: { type: string, nullable: true }
    RunReconciliationRequest:
      type: object
      additionalProperties: false
      required: [currency, day]
      properties:
        currency: { $ref: '#/components/schemas/Currency' }
        day: { type: string, format: date }

    # ---------- erp link
    ErpLinkCandidate:
      type: object
      additionalProperties: false
      required: [found, erpOrgId, displayName]
      properties:
        found: { type: boolean }
        erpOrgId: { type: string, nullable: true }
        displayName: { type: string, nullable: true }
    CreateErpLinkRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: { type: string, minLength: 1, maxLength: 120 }
        password: { type: string, minLength: 1, maxLength: 128 }
    ErpImportStatus:
      type: string
      enum: [pending, running, completed, failed]
    ErpLink:
      type: object
      additionalProperties: false
      required: [id, erpOrgId, displayName, linkedBy, linkedAt, importStatus, importedAt]
      properties:
        id: { type: string, format: uuid }
        erpOrgId: { type: string }
        displayName: { type: string }
        linkedBy: { type: string, format: uuid }
        linkedAt: { type: string, format: date-time }
        importStatus: { $ref: '#/components/schemas/ErpImportStatus' }
        importedAt: { type: string, format: date-time, nullable: true }
        importSummary:
          description: Always present; `null` until the import has run.
          nullable: true
          x-omitempty: false
          allOf: [{ $ref: '#/components/schemas/ErpImportSummary' }]
    ErpInvitedUser:
      type: object
      additionalProperties: false
      required: [email, role]
      properties:
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
    ErpImportSummary:
      type: object
      additionalProperties: false
      required: [projects, buyers, skippedBuyers, usersInvited, usersAlreadyMembers, usersWithoutPaymentsAccess, invitedUsers]
      properties:
        projects: { type: integer }
        buyers: { type: integer }
        skippedBuyers: { type: integer }
        usersInvited: { type: integer }
        usersAlreadyMembers: { type: integer }
        usersWithoutPaymentsAccess: { type: integer }
        invitedUsers:
          type: array
          items: { $ref: '#/components/schemas/ErpInvitedUser' }

    # ---------- my payments (payer view)
    MyPaymentCvu:
      type: object
      additionalProperties: false
      required: [currency, cvu, alias]
      properties:
        currency: { $ref: '#/components/schemas/Currency' }
        cvu: { type: string, pattern: '^[0-9]{22}$', maxLength: 22 }
        alias: { type: string, nullable: true }
    MyPaymentCompany:
      type: object
      additionalProperties: false
      required: [linkId, companyName, projectName, cvus, totalPaid, lastPaymentAt, erpLinked, hidden]
      properties:
        linkId: { type: string, format: uuid }
        companyName: { type: string }
        projectName:
          type: string
          nullable: true
          description: The project account the caller pays into; null for the company's main account.
        cvus:
          type: array
          description: The caller's active CVUs at this company.
          items: { $ref: '#/components/schemas/MyPaymentCvu' }
        totalPaid:
          type: array
          description: Sum of the caller's credited payins, one entry per currency paid.
          items: { $ref: '#/components/schemas/Money' }
        lastPaymentAt: { type: string, format: date-time, nullable: true }
        erpLinked: { type: boolean }
        hidden: { type: boolean }
    MyPaymentCompanyList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/MyPaymentCompany' }
    UpdateMyPaymentCompanyRequest:
      type: object
      additionalProperties: false
      required: [hidden]
      properties:
        hidden: { type: boolean }
    MyPaymentPayin:
      type: object
      additionalProperties: false
      required: [id, cvu, amount, status, createdAt, creditedAt]
      properties:
        id: { type: string, format: uuid }
        cvu: { type: string, pattern: '^[0-9]{22}$', maxLength: 22 }
        amount: { $ref: '#/components/schemas/Money' }
        status: { $ref: '#/components/schemas/PayinStatus' }
        createdAt: { type: string, format: date-time }
        creditedAt: { type: string, format: date-time, nullable: true }
    MyPaymentPayinList:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/MyPaymentPayin' }
        nextCursor: { type: string, nullable: true }
    InstallmentStatus:
      type: string
      enum: [pending, paid, overdue]
    AdjustmentIndex:
      type: string
      description: Index the installment is adjusted by (CAC construction cost, UVA purchasing power).
      enum: [CAC, UVA]
    MyPaymentInstallment:
      type: object
      additionalProperties: false
      required: [number, dueDate, amount, status, adjustmentIndex]
      properties:
        number: { type: integer, minimum: 1, maximum: 999 }
        dueDate: { type: string, format: date }
        amount: { $ref: '#/components/schemas/Money' }
        status: { $ref: '#/components/schemas/InstallmentStatus' }
        adjustmentIndex:
          type: string
          nullable: true
          description: Index the installment is adjusted by (CAC construction cost, UVA purchasing power); null when fixed.
          enum: [CAC, UVA]
    MyPaymentInstallments:
      type: object
      additionalProperties: false
      required: [erpLinked, items]
      properties:
        erpLinked: { type: boolean }
        items:
          type: array
          items: { $ref: '#/components/schemas/MyPaymentInstallment' }
    PayMyPaymentCompanyRequest:
      type: object
      additionalProperties: false
      required: [amount]
      properties:
        amount: { $ref: '#/components/schemas/Money' }
        installmentNumber: { type: integer, minimum: 1, maximum: 999 }
        concept: { type: string, minLength: 1, maxLength: 120 }

    # ---------- realtime / push
    RealtimeEventType:
      type: string
      enum: [payin.credited, payout.updated, approval.requested, balance.changed]
    RealtimeEvent:
      type: object
      additionalProperties: false
      required: [type, orgId, occurredAt, data]
      properties:
        type: { $ref: '#/components/schemas/RealtimeEventType' }
        orgId: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        data:
          type: object
          additionalProperties: true
          description: |
            Per type (see `streamOrgEvents`); every member is also copied to the top level of the
            frame. Clients may refetch through the authorized endpoints.
    RegisterPushTokenRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { type: string, minLength: 1, maxLength: 200 }
        platform:
          type: string
          enum: [ios, android, web, unknown]
          default: unknown
