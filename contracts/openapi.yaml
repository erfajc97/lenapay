openapi: 3.0.3
info:
  title: Lenapay API
  version: 0.1.0
  description: |
    Lenapay MVP API (docs/architecture.md §5). Money is always `{minor, currency}` with `minor`
    an int64 in minor units (cents). Errors always use the `Error` envelope; clients branch on
    `error.code`. Lists that can grow use cursor pagination (`{items, nextCursor}`).
    Money mutations require a client-generated `Idempotency-Key`; step-up protected routes
    require `X-Step-Up-Token` (5-minute token from `/auth/step-up/verify`).
servers:
  - url: http://localhost:18080
security:
  - bearerAuth: []
tags:
  - name: system
  - name: identity
  - name: orgs
  - name: kyc
  - name: accounts
  - name: payers
  - name: payins
  - name: payouts
  - name: movements
  - name: reconciliation
  - name: erplink
  - name: realtime
  - name: mypayments
  - name: notifications

paths:
  /healthz:
    get:
      operationId: getHealth
      tags: [system]
      security: []
      responses:
        '200':
          description: The API and its database answer.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- identity
  /auth/signup:
    post:
      operationId: signup
      tags: [identity]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignupRequest' }
      responses:
        '201':
          description: |
            User created; a 6-digit verification code was sent by email. When personal mode is on
            (PERSONAL_MODE_ENABLED), the user also gets their personal organization (kind
            `personal`, legal name = the email until the person KYC is approved, KYC `draft`)
            with its personal account; it shows in `GET /me` and `GET /orgs`. Its CVUs (ARS and
            USD) are issued automatically when the person KYC is approved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignupResponse' }
        default: { $ref: '#/components/responses/Error' }
  /auth/verify-email:
    post:
      operationId: verifyEmail
      tags: [identity]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyEmailRequest' }
      responses:
        '204': { description: Email verified. }
        default: { $ref: '#/components/responses/Error' }
  /auth/resend-code:
    post:
      operationId: resendEmailCode
      tags: [identity]
      security: []
      description: |
        Re-sends the 6-digit verification code of an unverified user (the previous code stops
        working). The answer is the same whether or not the email is registered or already
        verified (no user enumeration); at most 5 codes per hour per user (`request.rate_limited`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResendCodeRequest' }
      responses:
        '202': { description: Accepted; a code was sent if the email belongs to an unverified user. }
        default: { $ref: '#/components/responses/Error' }
  /auth/login:
    post:
      operationId: login
      tags: [identity]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Access + refresh tokens.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        default: { $ref: '#/components/responses/Error' }
  /auth/refresh:
    post:
      operationId: refreshToken
      tags: [identity]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: Rotated token pair (the old refresh token is consumed).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        default: { $ref: '#/components/responses/Error' }
  /auth/logout:
    post:
      operationId: logout
      tags: [identity]
      responses:
        '204': { description: Session revoked. }
        default: { $ref: '#/components/responses/Error' }
  /auth/step-up/challenge:
    post:
      operationId: createStepUpChallenge
      tags: [identity]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StepUpChallengeRequest' }
      responses:
        '201':
          description: Challenge to sign with the device key (or answer with the password).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StepUpChallenge' }
        default: { $ref: '#/components/responses/Error' }
  /auth/step-up/verify:
    post:
      operationId: verifyStepUp
      tags: [identity]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StepUpVerifyRequest' }
      responses:
        '200':
          description: Step-up token bound to the current session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StepUpToken' }
        default: { $ref: '#/components/responses/Error' }
  /devices:
    post:
      operationId: registerDevice
      tags: [identity]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterDeviceRequest' }
      responses:
        '201':
          description: Device key registered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
        default: { $ref: '#/components/responses/Error' }
  /.well-known/jwks.json:
    get:
      operationId: getJwks
      tags: [identity]
      security: []
      responses:
        '200':
          description: Public keys of the local identity provider.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Jwks' }
        default: { $ref: '#/components/responses/Error' }
  /me:
    get:
      operationId: getMe
      tags: [identity]
      responses:
        '200':
          description: Current user, memberships and preferences.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateMe
      tags: [identity]
      description: |
        Updates the caller's profile. `fullName`: a string sets it (trimmed, 1–120 characters),
        `null` clears it, absent keeps it. The person KYC approval fills it when it is empty.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMeRequest' }
      responses:
        '200':
          description: The updated profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        default: { $ref: '#/components/responses/Error' }
  /me/preferences:
    get:
      operationId: getMyPreferences
      tags: [identity]
      responses:
        '200':
          description: The caller's preferences (every field `null` until set).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPreferences' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateMyPreferences
      tags: [identity]
      description: |
        Partial update: a value sets the field, `null` clears it, absent keeps it. The MERGED
        state is validated: `defaultOrgId` must be an organization the caller belongs to
        (`org.not_found` otherwise); `defaultAccountId` needs a `defaultOrgId` and must be a
        non-archived account of that organization (`account.not_found`, `account.archived`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdatePreferencesRequest' }
      responses:
        '200':
          description: The stored preferences.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPreferences' }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- orgs
  /orgs:
    get:
      operationId: listOrgs
      tags: [orgs]
      responses:
        '200':
          description: Organizations the caller belongs to.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationList' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: createOrg
      tags: [orgs]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrgRequest' }
      responses:
        '201':
          description: |
            Organization created; the caller is its admin. A user has ONE personal organization,
            created at signup when personal mode is on: asking for another one is `conflict` (409).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }
        default: { $ref: '#/components/responses/Error' }
  /orgs/{orgId}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      operationId: getOrg
      tags: [orgs]
      responses:
        '200':
          description: Organization.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }
        default: { $ref: '#/components/responses/Error' }
  /orgs/{orgId}/members:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      operationId: listMembers
      tags: [orgs]
      responses:
        '200':
          description: Members of the organization.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberList' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: addMember
      tags: [orgs]
      description: Adds an already registered user directly with a role (admins only, never above the caller's role).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddMemberRequest' }
      responses:
        '201':
          description: Member added.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        default: { $ref: '#/components/responses/Error' }
  /orgs/{orgId}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/UserId'
    patch:
      operationId: updateMember
      tags: [orgs]
      description: |
        Changes a member's role (admins only, never above the caller's role). Only the owner
        changes an admin's role; an admin changing another admin is `role.escalation_forbidden`.
        The owner's own role never changes here (`org.last_admin`, 409): ownership moves only
        through `POST /orgs/{orgId}/ownership-transfer`. `owner` is not a grantable role.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMemberRequest' }
      responses:
        '200':
          description: Role changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: removeMember
      tags: [orgs]
      description: |
        Removes a member (admins only). Only the owner removes an admin
        (`role.escalation_forbidden` otherwise); nobody removes the owner (`org.last_admin`, 409).
      responses:
        '204': { description: Member removed. }
        default: { $ref: '#/components/responses/Error' }
  /orgs/{orgId}/ownership-transfer:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    post:
      operationId: transferOwnership
      tags: [orgs]
      description: |
        The owner (step-up) makes another member the owner; the previous owner becomes admin.
        A user who is not a member is `member.not_found`; the caller themselves is
        `validation.failed`. Audited as `org.ownership_transfer`.
      parameters:
        - $ref: '#/components/parameters/StepUpTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferOwnershipRequest' }
      responses:
        '200':
          description: Ownership moved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnershipTransfer' }
        default: { $ref: '#/components/responses/Error' }
  /orgs/{orgId}/approval-policy:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      operationId: getApprovalPolicy
      tags: [orgs]
      description: |
        The organization's payout approval policy (defaults until the owner changes it: mode
        `always`, no thresholds, `allowOwnerSelfApproval: true`). Personal organizations never
        need approval, whatever the policy says.
      responses:
        '200':
          description: The policy in force.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalPolicy' }
        default: { $ref: '#/components/responses/Error' }
    put:
      operationId: updateApprovalPolicy
      tags: [orgs]
      description: |
        Replaces the policy (owner only, step-up; audited as `org.approval_policy_update`).
        `mode: threshold` needs at least one threshold: a company payout whose amount (fee not
        included) is STRICTLY below its currency's threshold is approved and dispatched at once;
        a currency without a threshold always needs approval. Thresholds are kept but ignored
        while the mode is `always`. `allowOwnerSelfApproval` lets the owner approve their own
        payout only while no other member has a role ≥ approver.
      parameters:
        - $ref: '#/components/parameters/StepUpTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateApprovalPolicyRequest' }
      responses:
        '200':
          description: The stored policy.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalPolicy' }
        default: { $ref: '#/components/responses/Error' }
  /orgs/{orgId}/invites:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    post:
      operationId: createInvite
      tags: [orgs]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateInviteRequest' }
      responses:
        '201':
          description: Invite created and emailed; expires in 7 days.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invite' }
        default: { $ref: '#/components/responses/Error' }
  /invites/{token}/accept:
    parameters:
      - name: token
        in: path
        required: true
        description: Single-use invite token (stored hashed).
        schema: { type: string, minLength: 16, maxLength: 128, pattern: '^[A-Za-z0-9_-]+$' }
    post:
      operationId: acceptInvite
      tags: [orgs]
      responses:
        '200':
          description: The caller is now a member.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Membership' }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- kyc
  /orgs/{orgId}/kyc:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      operationId: getKyc
      tags: [kyc]
      responses:
        '200':
          description: The onboarding case of the organization.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KycCase' }
        default: { $ref: '#/components/responses/Error' }
    put:
      operationId: updateKyc
      tags: [kyc]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateKycRequest' }
      responses:
        '200':
          description: Case updated (only while `draft` or `rejected`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KycCase' }
        default: { $ref: '#/components/responses/Error' }
  /orgs/{orgId}/kyc/documents:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    post:
      operationId: uploadKycDocument
      tags: [kyc]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/KycDocumentUpload' }
      responses:
        '201':
          description: Document stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KycDocument' }
        default: { $ref: '#/components/responses/Error' }
  /orgs/{orgId}/kyc/submit:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    post:
      operationId: submitKyc
      tags: [kyc]
      responses:
        '200':
          description: Case submitted for review.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KycCase' }
        default: { $ref: '#/components/responses/Error' }
  /internal/kyc/{caseId}/decision:
    parameters:
      - name: caseId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: decideKyc
      tags: [kyc]
      security:
        - internalApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KycDecisionRequest' }
      responses:
        '200':
          description: Decision recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KycCase' }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- accounts
  /orgs/{orgId}/accounts:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      operationId: listAccounts
      tags: [accounts]
      parameters:
        - name: includeArchived
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Accounts with balances.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountList' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: createAccount
      tags: [accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAccountRequest' }
      responses:
        '201':
          description: Project account created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        default: { $ref: '#/components/responses/Error' }
  /orgs/{orgId}/accounts/{accountId}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/AccountId'
    patch:
      operationId: updateAccount
      tags: [accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAccountRequest' }
      responses:
        '200':
          description: |
            Account renamed or archived. Only project accounts can be archived
            (`account.not_archivable` otherwise), and only with zero balance (`account.not_empty`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        default: { $ref: '#/components/responses/Error' }
  /orgs/{orgId}/accounts/{accountId}/cvus/{cvuId}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/CvuId'
    patch:
      operationId: updateAccountCvu
      tags: [accounts]
      description: |
        Changes the alias of the account's own receiving CVU (the personal CVUs; `Account.cvus`)
        at the PSP. A payer's CVU, or a CVU of another account or org, is `cvu.not_found` (404).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCvuRequest' }
      responses:
        '200':
          description: Alias changed at the PSP.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountCvu' }
        default: { $ref: '#/components/responses/Error' }
  /orgs/{orgId}/balances:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      operationId: getBalances
      tags: [accounts]
      responses:
        '200':
          description: Totals per currency and per account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Balances' }
        default: { $ref: '#/components/responses/Error' }
  /orgs/{orgId}/internal-transfers:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    post:
      operationId: createInternalTransfer
      tags: [accounts]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - $ref: '#/components/parameters/StepUpTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InternalTransferRequest' }
      responses:
        '201':
          description: Transfer posted to the ledger (or the stored response replayed).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InternalTransfer' }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- payers / CVU
  /orgs/{orgId}/payers:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      operationId: listPayers
      tags: [payers]
      parameters:
        - name: accountId
          in: query
          schema: { type: string, format: uuid }
        - name: q
          in: query
          description: Search by name or document number.
          schema: { type: string, maxLength: 80 }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Payers page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayerList' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: createPayer
      tags: [payers]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePayerRequest' }
      responses:
        '201':
          description: Payer created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payer' }
        default: { $ref: '#/components/responses/Error' }
  /orgs/{orgId}/payers/{payerId}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/PayerId'
    get:
      operationId: getPayer
      tags: [payers]
      responses:
        '200':
          description: Payer with its CVUs.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payer' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      operationId: updatePayer
      tags: [payers]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdatePayerRequest' }
      responses:
        '200':
          description: Payer updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payer' }
        default: { $ref: '#/components/responses/Error' }
  /orgs/{orgId}/payers/{payerId}/cvus:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/PayerId'
    post:
      operationId: createCvu
      tags: [payers]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - $ref: '#/components/parameters/StepUpTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCvuRequest' }
      responses:
        '201':
          description: CVU issued at the PSP (one per payer per currency).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cvu' }
        default: { $ref: '#/components/responses/Error' }
  /orgs/{orgId}/cvus/{cvuId}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/CvuId'
    patch:
      operationId: updateCvu
      tags: [payers]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCvuRequest' }
      responses:
        '200':
          description: Alias changed at the PSP.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cvu' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: disableCvu
      tags: [payers]
      responses:
        '204': { description: CVU disabled at the PSP. }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- payins
  /webhooks/psp/transfers:
    post:
      operationId: receivePspTransferWebhook
      tags: [payins]
      security: []
      description: |
        Signed by the PSP: `X-Signature: sha256=<hex hmac-sha256(secret, timestamp + "." + raw body)>`.
        The body only announces the transfer; Lenapay re-reads it at the PSP before crediting.
        Hand-mounted (excluded from code generation): the signature covers the raw body.
      parameters:
        - name: X-Signature
          in: header
          required: true
          schema: { type: string, maxLength: 200 }
        - name: X-Signature-Timestamp
          in: header
          required: true
          description: Unix seconds; rejected outside a 5-minute tolerance.
          schema: { type: string, maxLength: 20 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PspTransferWebhook' }
      responses:
        '202': { description: Event stored (or already known) and queued. }
        default: { $ref: '#/components/responses/Error' }
  /orgs/{orgId}/payins/{payinId}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - name: payinId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getPayin
      tags: [payins]
      responses:
        '200':
          description: Payin detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payin' }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- payouts
  /orgs/{orgId}/destinations/resolve:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      operationId: resolveDestination
      tags: [payouts]
      parameters:
        - name: to
          in: query
          required: true
          description: CBU, CVU (22 digits) or alias.
          schema: { type: string, minLength: 6, maxLength: 22 }
      responses:
        '200':
          description: Destination resolved at the PSP.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Destination' }
        default: { $ref: '#/components/responses/Error' }
  /orgs/{orgId}/payouts/quote:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    post:
      operationId: quotePayout
      tags: [payouts]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PayoutQuoteRequest' }
      responses:
        '200':
          description: Fee and total before confirming.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayoutQuote' }
        default: { $ref: '#/components/responses/Error' }
  /orgs/{orgId}/payouts:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    post:
      operationId: createPayout
      tags: [payouts]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - $ref: '#/components/parameters/StepUpTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePayoutRequest' }
      responses:
        '201':
          description: |
            Payout created with amount + fee held (or the stored response replayed). To a Lenapay
            CVU or alias (`rail: internal`) it never reaches the PSP: a personal payout comes back
            already `settled`, a company payout settles the moment it is approved. A company
            payout is `pending_approval` unless the org's approval policy is `threshold` and the
            amount is strictly below its currency's threshold: then it is `approved` (and
            dispatched) at once, with an event whose reason is `policy_threshold`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payout' }
        default: { $ref: '#/components/responses/Error' }
  /orgs/{orgId}/payouts/{payoutId}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/PayoutId'
    get:
      operationId: getPayout
      tags: [payouts]
      responses:
        '200':
          description: Payout with its status history.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payout' }
        default: { $ref: '#/components/responses/Error' }
  /orgs/{orgId}/payouts/{payoutId}/approve:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/PayoutId'
    post:
      operationId: approvePayout
      tags: [payouts]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - $ref: '#/components/parameters/StepUpTokenHeader'
      responses:
        '200':
          description: |
            Approved and queued for dispatch. Never by its creator
            (`payout.self_approval_forbidden`), except the owner when the approval policy allows
            owner self-approval and no other member has a role ≥ approver (audited as
            `payout.self_approval`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payout' }
        default: { $ref: '#/components/responses/Error' }
  /orgs/{orgId}/payouts/{payoutId}/reject:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/PayoutId'
    post:
      operationId: rejectPayout
      tags: [payouts]
      parameters:
        - $ref: '#/components/parameters/StepUpTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RejectPayoutRequest' }
      responses:
        '200':
          description: Rejected; the hold is released.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payout' }
        default: { $ref: '#/components/responses/Error' }
  /orgs/{orgId}/payouts/{payoutId}/cancel:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/PayoutId'
    post:
      operationId: cancelPayout
      tags: [payouts]
      responses:
        '200':
          description: Cancelled by its creator while pending approval; the hold is released.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payout' }
        default: { $ref: '#/components/responses/Error' }
  /orgs/{orgId}/payouts/{payoutId}/attachments:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/PayoutId'
    post:
      operationId: uploadPayoutAttachment
      tags: [payouts]
      description: |
        Attaches a supporting document (invoice, receipt) to a payout: PDF, JPEG or PNG decided by
        the file's magic bytes (`payout.attachment_invalid` otherwise, or past 10 attachments),
        at most 10 MB. Listed in `Payout.attachments`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/PayoutAttachmentUpload' }
      responses:
        '201':
          description: Attachment stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayoutAttachment' }
        default: { $ref: '#/components/responses/Error' }
  /orgs/{orgId}/payouts/{payoutId}/proof.pdf:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/PayoutId'
    get:
      operationId: getPayoutProof
      tags: [payouts]
      responses:
        '200':
          description: Proof of payment of a settled payout.
          content:
            application/pdf:
              schema: { type: string, format: binary }
        default: { $ref: '#/components/responses/Error' }
  /orgs/{orgId}/approvals:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      operationId: listApprovals
      tags: [payouts]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Payouts pending approval that the caller may approve.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayoutList' }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- movements
  /orgs/{orgId}/movements:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      operationId: listMovements
      tags: [movements]
      parameters:
        - name: account
          in: query
          schema: { type: string, format: uuid }
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/MovementType' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/MovementStatus' }
        - name: currency
          in: query
          schema: { $ref: '#/components/schemas/Currency' }
        - name: from
          in: query
          description: Business date (inclusive), in the configured business time zone.
          schema: { type: string, format: date }
        - name: to
          in: query
          description: Business date (inclusive).
          schema: { type: string, format: date }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Movements page, newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MovementList' }
        default: { $ref: '#/components/responses/Error' }
  /orgs/{orgId}/movements/{movementId}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - name: movementId
        in: path
        required: true
        description: A `Movement.id` from the list (payin, payout or internal-transfer leg).
        schema: { type: string, format: uuid }
    get:
      operationId: getMovement
      tags: [movements]
      responses:
        '200':
          description: One movement; `refId` leads to the payin, payout or internal transfer.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Movement' }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- reconciliation
  /orgs/{orgId}/reconciliation/runs:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    post:
      operationId: createReconciliationRun
      tags: [reconciliation]
      description: Queues an on-demand run of the organization's movements for a business day (admins).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunReconciliationRequest' }
      responses:
        '202':
          description: Run queued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReconciliationRun' }
        default: { $ref: '#/components/responses/Error' }
    get:
      operationId: listReconciliationRuns
      tags: [reconciliation]
      parameters:
        - name: currency
          in: query
          schema: { $ref: '#/components/schemas/Currency' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Reconciliation runs, newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReconciliationRunList' }
        default: { $ref: '#/components/responses/Error' }
  /orgs/{orgId}/reconciliation/runs/{runId}/items:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - name: runId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listReconciliationItems
      tags: [reconciliation]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Items of one of the organization's runs, in processing order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReconciliationItemList' }
        default: { $ref: '#/components/responses/Error' }
  /internal/reconciliation/run:
    post:
      operationId: runReconciliation
      tags: [reconciliation]
      security:
        - internalApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunReconciliationRequest' }
      responses:
        '202':
          description: Run queued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReconciliationRun' }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- erp link
  /orgs/{orgId}/erp-link/candidate:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      operationId: getErpLinkCandidate
      tags: [erplink]
      responses:
        '200':
          description: Whether the organization's CUIT exists in the ERP identity index.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErpLinkCandidate' }
        default: { $ref: '#/components/responses/Error' }
  /orgs/{orgId}/erp-link:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      operationId: getErpLink
      tags: [erplink]
      responses:
        '200':
          description: |
            Current link and import status. `importSummary` (null until the import ran) counts
            what was copied and the ERP users invited: each ERP user with a payments permission
            gets an invite with the role mapped from it (never above the linking admin, never
            owner); users already members are skipped. Invites of the import are accepted
            automatically when that email verifies its account or logs in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErpLink' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: createErpLink
      tags: [erplink]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateErpLinkRequest' }
      responses:
        '201':
          description: Linked after the ERP credentials check; the import job is queued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErpLink' }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- realtime / push
  /orgs/{orgId}/events:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      operationId: streamOrgEvents
      tags: [realtime]
      description: |
        Server-sent events. Every frame is UNNAMED (no `event:` line, so an EventSource delivers
        it as `message`); its `data:` line is one JSON object: the `RealtimeEvent` envelope
        `{type, orgId, occurredAt, data}` with every member of `data` ALSO copied to the top level
        (e.g. `event.payin`, `event.payout`). Comment lines (`: ping`) are heartbeats every 15 s.
        Delivery is best effort: clients refetch on reconnect. Event types and their `data`:
        `payin.credited` → `{payinId, accountId, cvuId, payerId, payin}`;
        `payout.updated` → `{payoutId, status, payout}` (`payout` is a `Payout`, any status change);
        `approval.requested` → `{payoutId, status, payout}`;
        `balance.changed` → `{accountId}`.
        Hand-mounted (excluded from code generation).
      responses:
        '200':
          description: Event stream.
          content:
            text/event-stream:
              schema: { type: string }
        default: { $ref: '#/components/responses/Error' }
  /push-tokens:
    post:
      operationId: registerPushToken
      tags: [notifications]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterPushTokenRequest' }
      responses:
        '204': { description: Token registered for the caller. }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- my payments (payer view)
  /me/payments/companies:
    get:
      operationId: listMyPaymentCompanies
      tags: [mypayments]
      description: |
        "Mis pagos": the companies the caller pays to. The caller must own a personal org whose
        KYC is approved with a verified DNI; payers of any company whose document is that DNI
        (or a CUIT/CUIL whose middle 8 digits are it) are linked on KYC approval and again on
        every read. Only the company's display name, the project, the caller's own CVUs and
        the caller's own payins are exposed. `kyc.not_approved` when the caller has no
        verified personal org.
      parameters:
        - name: includeHidden
          in: query
          description: Also list the companies the caller hid.
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Linked companies, newest match first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyPaymentCompanyList' }
        default: { $ref: '#/components/responses/Error' }
  /me/payments/companies/{linkId}:
    parameters:
      - $ref: '#/components/parameters/LinkId'
    patch:
      operationId: updateMyPaymentCompany
      tags: [mypayments]
      description: Hides or shows a company in the list (`payer_link.not_found` when not the caller's).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMyPaymentCompanyRequest' }
      responses:
        '200':
          description: The company with its new visibility.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyPaymentCompany' }
        default: { $ref: '#/components/responses/Error' }
  /me/payments/companies/{linkId}/payins:
    parameters:
      - $ref: '#/components/parameters/LinkId'
    get:
      operationId: listMyPaymentCompanyPayins
      tags: [mypayments]
      description: The caller's payins to that company's CVUs, newest first.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Payins page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyPaymentPayinList' }
        default: { $ref: '#/components/responses/Error' }
  /me/payments/companies/{linkId}/installments:
    parameters:
      - $ref: '#/components/parameters/LinkId'
    get:
      operationId: listMyPaymentCompanyInstallments
      tags: [mypayments]
      description: |
        The caller's installments (cuotas) from the company's ERP. `erpLinked` is false and
        `items` empty when the company is not linked to the ERP.
      responses:
        '200':
          description: Installments by number.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyPaymentInstallments' }
        default: { $ref: '#/components/responses/Error' }
  /me/payments/companies/{linkId}/pay:
    parameters:
      - $ref: '#/components/parameters/LinkId'
    post:
      operationId: payMyPaymentCompany
      tags: [mypayments]
      description: |
        Pays the company from the caller's personal account to the caller's CVU at that
        company in the amount's currency (`money.currency_mismatch` when there is none). A
        personal payout is sent directly (no approval). `installmentNumber` must be one of the
        caller's installments (`installment.not_found`) and is written in the concept.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - $ref: '#/components/parameters/StepUpTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PayMyPaymentCompanyRequest' }
      responses:
        '201':
          description: Payout created from the personal account (or the stored response replayed).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payout' }
        default: { $ref: '#/components/responses/Error' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    internalApiKey:
      type: apiKey
      in: header
      name: X-Internal-Api-Key

  parameters:
    OrgId:
      name: orgId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AccountId:
      name: accountId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PayerId:
      name: payerId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CvuId:
      name: cvuId
      in: path
      required: true
      schema: { type: string, format: uuid }
    LinkId:
      name: linkId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PayoutId:
      name: payoutId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated (UUID recommended), persisted by the client until the action is confirmed.
      schema: { type: string, minLength: 16, maxLength: 128, pattern: '^[A-Za-z0-9_-]+$' }
    StepUpTokenHeader:
      name: X-Step-Up-Token
      in: header
      required: true
      description: Token from `/auth/step-up/verify`, bound to the session, valid 5 minutes.
      schema: { type: string, maxLength: 2048 }
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from a previous page's `nextCursor`.
      schema: { type: string, maxLength: 200 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  responses:
    Error:
      description: Error envelope (status 4xx/5xx).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    # ---------- shared
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: { $ref: '#/components/schemas/ErrorBody' }
    ErrorBody:
      type: object
      additionalProperties: false
      required: [code, message, requestId]
      properties:
        code:
          type: string
          maxLength: 64
          description: Stable machine code from the catalog, e.g. `ledger.insufficient_funds`.
        message:
          type: string
          maxLength: 200
          description: Developer-facing English text; never shown to users.
        details:
          type: object
          additionalProperties: true
          description: Ids and enums only (e.g. the failing field); never PII.
        requestId:
          type: string
          maxLength: 64
    Currency:
      type: string
      enum: [ARS, USD]
    Money:
      type: object
      additionalProperties: false
      required: [minor, currency]
      properties:
        minor:
          type: integer
          format: int64
          minimum: -9007199254740991
          maximum: 9007199254740991
          description: Amount in minor units (cents); bounded to JS-safe integers because clients parse JSON numbers.
        currency: { $ref: '#/components/schemas/Currency' }
    Role:
      type: string
      description: A role that can be granted (invites, add member, role change). `owner` is not one of them.
      enum: [viewer, operator, approver, admin]
    MemberRole:
      type: string
      description: |
        A member's role, least to most privileged: viewer < operator < approver < admin < owner.
        Exactly one owner per organization (its creator, or whoever received a transfer).
      enum: [viewer, operator, approver, admin, owner]
    OrgKind:
      type: string
      enum: [company, personal]
    KycStatus:
      type: string
      enum: [draft, submitted, approved, rejected]
    DocType:
      type: string
      enum: [cuit, cuil, dni]
    Address:
      type: object
      additionalProperties: false
      required: [street, number, city, province, postalCode]
      properties:
        street: { type: string, minLength: 1, maxLength: 120 }
        number: { type: string, minLength: 1, maxLength: 20 }
        floor: { type: string, maxLength: 20 }
        city: { type: string, minLength: 1, maxLength: 80 }
        province: { type: string, minLength: 1, maxLength: 80 }
        postalCode: { type: string, minLength: 1, maxLength: 10 }
        country: { type: string, minLength: 2, maxLength: 2, default: AR }

    # ---------- identity
    SignupRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 10, maxLength: 128 }
        fullName:
          type: string
          minLength: 1
          maxLength: 120
          description: Optional display name (trimmed; blank is `validation.failed`).
    SignupResponse:
      type: object
      additionalProperties: false
      required: [userId]
      properties:
        userId: { type: string, format: uuid }
    VerifyEmailRequest:
      type: object
      additionalProperties: false
      required: [email, code]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        code: { type: string, pattern: '^[0-9]{6}$', maxLength: 6 }
    ResendCodeRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254 }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 128 }
        deviceId:
          type: string
          format: uuid
          description: Registered device of this phone, if any.
        totpCode:
          type: string
          pattern: '^[0-9]{6}$'
          maxLength: 6
          description: Required when the user has TOTP MFA enabled (`auth.mfa_required` otherwise).
    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken: { type: string, minLength: 16, maxLength: 512 }
    TokenPair:
      type: object
      additionalProperties: false
      required: [accessToken, accessTokenExpiresAt, refreshToken, refreshTokenExpiresAt, tokenType]
      properties:
        accessToken: { type: string }
        accessTokenExpiresAt: { type: string, format: date-time }
        refreshToken: { type: string }
        refreshTokenExpiresAt: { type: string, format: date-time }
        tokenType:
          type: string
          enum: [Bearer]
    StepUpChallengeRequest:
      type: object
      additionalProperties: false
      properties:
        deviceId:
          type: string
          format: uuid
          description: Device whose key will sign the nonce; omit for the password fallback.
    StepUpChallenge:
      type: object
      additionalProperties: false
      required: [challengeId, nonce, expiresAt]
      properties:
        challengeId: { type: string, format: uuid }
        nonce:
          type: string
          description: Base64url bytes to sign with the device key.
        expiresAt: { type: string, format: date-time }
    StepUpVerifyRequest:
      type: object
      additionalProperties: false
      required: [challengeId, method]
      properties:
        challengeId: { type: string, format: uuid }
        method:
          type: string
          enum: [device_signature, password]
        deviceId: { type: string, format: uuid }
        signature:
          type: string
          maxLength: 200
          description: Base64url Ed25519 signature of the nonce (method device_signature).
        password:
          type: string
          maxLength: 128
          description: Account password (method password).
    StepUpToken:
      type: object
      additionalProperties: false
      required: [stepUpToken, expiresAt]
      properties:
        stepUpToken: { type: string }
        expiresAt: { type: string, format: date-time }
    RegisterDeviceRequest:
      type: object
      additionalProperties: false
      required: [publicKey, name]
      properties:
        publicKey:
          type: string
          minLength: 43
          maxLength: 64
          description: Base64url Ed25519 public key (32 bytes).
        name: { type: string, minLength: 1, maxLength: 80 }
    Device:
      type: object
      additionalProperties: false
      required: [id, name, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        createdAt: { type: string, format: date-time }
    Jwk:
      type: object
      additionalProperties: false
      required: [kty, crv, x, kid, alg, use]
      properties:
        kty: { type: string, enum: [OKP] }
        crv: { type: string, enum: [Ed25519] }
        x: { type: string }
        kid: { type: string }
        alg: { type: string, enum: [EdDSA] }
        use: { type: string, enum: [sig] }
    Jwks:
      type: object
      additionalProperties: false
      required: [keys]
      properties:
        keys:
          type: array
          items: { $ref: '#/components/schemas/Jwk' }
    User:
      type: object
      additionalProperties: false
      required: [id, email, emailVerified, mfaEnabled, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        fullName:
          type: string
          nullable: true
          x-omitempty: false
          description: Always present (`null` when unset).
        emailVerified: { type: boolean }
        mfaEnabled: { type: boolean }
        createdAt: { type: string, format: date-time }
    Membership:
      type: object
      additionalProperties: false
      required: [orgId, orgName, orgKind, role, kycStatus]
      properties:
        orgId: { type: string, format: uuid }
        orgName: { type: string }
        orgKind: { $ref: '#/components/schemas/OrgKind' }
        role: { $ref: '#/components/schemas/MemberRole' }
        kycStatus: { $ref: '#/components/schemas/KycStatus' }
    Me:
      type: object
      additionalProperties: false
      required: [user, memberships]
      properties:
        user: { $ref: '#/components/schemas/User' }
        memberships:
          type: array
          items: { $ref: '#/components/schemas/Membership' }
        preferences:
          description: Always present (every field `null` until set).
          allOf: [{ $ref: '#/components/schemas/UserPreferences' }]
    UpdateMeRequest:
      type: object
      additionalProperties: false
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 120
          nullable: true
