    Locale:
      type: string
      enum: [es-AR, en-US]
    Theme:
      type: string
      enum: [system, light, dark]
    UserPreferences:
      type: object
      additionalProperties: false
      required: [defaultOrgId, defaultAccountId, locale, theme, updatedAt]
      properties:
        defaultOrgId: { type: string, format: uuid, nullable: true }
        defaultAccountId: { type: string, format: uuid, nullable: true }
        locale: { type: string, enum: [es-AR, en-US], nullable: true }
        theme: { type: string, enum: [system, light, dark], nullable: true }
        updatedAt: { type: string, format: date-time, nullable: true }
    UpdatePreferencesRequest:
      type: object
      additionalProperties: false
      properties:
        defaultOrgId:
          type: string
          format: uuid
          nullable: true
          x-go-type: nullable.Nullable[string]
          x-go-type-import: { path: github.com/oapi-codegen/nullable }
          x-go-type-skip-optional-pointer: true
        defaultAccountId:
          type: string
          format: uuid
          nullable: true
          x-go-type: nullable.Nullable[string]
          x-go-type-import: { path: github.com/oapi-codegen/nullable }
          x-go-type-skip-optional-pointer: true
        locale:
          type: string
          enum: [es-AR, en-US]
          nullable: true
          x-go-type: nullable.Nullable[string]
          x-go-type-import: { path: github.com/oapi-codegen/nullable }
          x-go-type-skip-optional-pointer: true
        theme:
          type: string
          enum: [system, light, dark]
          nullable: true
          x-go-type: nullable.Nullable[string]
          x-go-type-import: { path: github.com/oapi-codegen/nullable }
          x-go-type-skip-optional-pointer: true

    # ---------- orgs
    Organization:
      type: object
      additionalProperties: false
      required: [id, kind, legalName, cuit, kycStatus, role, createdAt]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/OrgKind' }
        legalName: { type: string }
        cuit: { type: string, nullable: true }
        kycStatus: { $ref: '#/components/schemas/KycStatus' }
        role: { $ref: '#/components/schemas/MemberRole' }
        createdAt: { type: string, format: date-time }
    OrganizationList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Organization' }
    CreateOrgRequest:
      type: object
      additionalProperties: false
      required: [kind, legalName]
      properties:
        kind: { $ref: '#/components/schemas/OrgKind' }
        legalName: { type: string, minLength: 2, maxLength: 200 }
        cuit: { type: string, pattern: '^[0-9]{11}$', maxLength: 11 }
    Member:
      type: object
      additionalProperties: false
      required: [userId, email, role, joinedAt]
      properties:
        userId: { type: string, format: uuid }
        email: { type: string, format: email }
        fullName:
          type: string
          nullable: true
          x-omitempty: false
          description: Always present (`null` when the user has not set one).
        role: { $ref: '#/components/schemas/MemberRole' }
        joinedAt: { type: string, format: date-time }
    MemberList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Member' }
    AddMemberRequest:
      type: object
      additionalProperties: false
      required: [email, role]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        role: { $ref: '#/components/schemas/Role' }
    UpdateMemberRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role: { $ref: '#/components/schemas/Role' }
    CreateInviteRequest:
      type: object
      additionalProperties: false
      required: [email, role]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        role: { $ref: '#/components/schemas/Role' }
    Invite:
      type: object
      additionalProperties: false
      required: [id, email, role, expiresAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    TransferOwnershipRequest:
      type: object
      additionalProperties: false
      required: [userId]
      properties:
        userId: { type: string, format: uuid }
    OwnershipTransfer:
      type: object
      additionalProperties: false
      required: [previousOwner, owner]
      properties:
        previousOwner: { $ref: '#/components/schemas/Member' }
        owner: { $ref: '#/components/schemas/Member' }
    ApprovalMode:
      type: string
      enum: [always, threshold]
    ApprovalThresholds:
      type: object
      additionalProperties: false
      required: [ARS, USD]
      description: Per currency, in minor units; `null` = that currency always needs approval.
      properties:
        ARS: { type: integer, format: int64, nullable: true }
        USD: { type: integer, format: int64, nullable: true }
    ApprovalPolicy:
      type: object
      additionalProperties: false
      required: [mode, thresholdMinor, allowOwnerSelfApproval, ownerSelfApprovalEffective, updatedBy, updatedAt]
      properties:
        mode: { $ref: '#/components/schemas/ApprovalMode' }
        thresholdMinor: { $ref: '#/components/schemas/ApprovalThresholds' }
        allowOwnerSelfApproval: { type: boolean }
        ownerSelfApprovalEffective:
          type: boolean
          description: True when the owner may approve their own payouts right now (allowed and no other member with a role >= approver).
        updatedBy: { type: string, format: uuid, nullable: true }
        updatedAt: { type: string, format: date-time, nullable: true }
    UpdateApprovalThresholds:
      type: object
      additionalProperties: false
      description: Thresholds in minor units (>= 1); an absent currency has none.
      properties:
        ARS: { type: integer, format: int64, minimum: 1, maximum: 9007199254740991 }
        USD: { type: integer, format: int64, minimum: 1, maximum: 9007199254740991 }
    UpdateApprovalPolicyRequest:
      type: object
      additionalProperties: false
      required: [mode, allowOwnerSelfApproval]
      properties:
        mode: { $ref: '#/components/schemas/ApprovalMode' }
        thresholdMinor: { $ref: '#/components/schemas/UpdateApprovalThresholds' }
        allowOwnerSelfApproval: { type: boolean }

    # ---------- kyc
    KycCaseKind:
      type: string
      enum: [company, person]
    KycRepresentative:
      type: object
      additionalProperties: false
      required: [fullName, dni, position]
      properties:
        fullName: { type: string, minLength: 2, maxLength: 120 }
        dni: { type: string, pattern: '^[0-9]{7,8}$', maxLength: 8 }
        position: { type: string, minLength: 2, maxLength: 80 }
    KycCompanyData:
      type: object
      additionalProperties: false
      required: [cuit, legalName, legalAddress, representatives]
      properties:
        cuit: { type: string, pattern: '^[0-9]{11}$', maxLength: 11 }
        legalName: { type: string, minLength: 2, maxLength: 200 }
        legalAddress: { $ref: '#/components/schemas/Address' }
        representatives:
          type: array
          minItems: 1
          maxItems: 10
          items: { $ref: '#/components/schemas/KycRepresentative' }
    KycPersonData:
      type: object
      additionalProperties: false
      required: [fullName, dni, birthDate, address]
      properties:
        fullName: { type: string, minLength: 2, maxLength: 120 }
        dni: { type: string, pattern: '^[0-9]{7,8}$', maxLength: 8 }
        birthDate: { type: string, format: date }
        address: { $ref: '#/components/schemas/Address' }
    UpdateKycRequest:
      type: object
      additionalProperties: false
      description: Exactly one of `company` (company orgs) or `person` (personal orgs).
      properties:
        company: { $ref: '#/components/schemas/KycCompanyData' }
        person: { $ref: '#/components/schemas/KycPersonData' }
    KycDocumentKind:
      type: string
      enum: [bylaws, afip_constancy, dni_front, dni_back, selfie, other]
    KycDocumentUpload:
      type: object
      additionalProperties: false
      required: [kind, file]
      properties:
        kind: { $ref: '#/components/schemas/KycDocumentKind' }
        representativeDni:
          type: string
          pattern: '^[0-9]{7,8}$'
          maxLength: 8
          description: For DNI and selfie documents of a company representative.
        file:
          type: string
          format: binary
          description: PDF, JPEG or PNG, at most 10 MB (the upload body limit).
    KycDocument:
      type: object
      additionalProperties: false
      required: [id, kind, representativeDni, fileName, contentType, sizeBytes, createdAt]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/KycDocumentKind' }
        representativeDni: { type: string, nullable: true }
        fileName: { type: string }
        contentType: { type: string }
        sizeBytes: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
    KycCase:
      type: object
      additionalProperties: false
      required: [id, orgId, kind, status, documents, decisionReason, submittedAt, decidedAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        orgId: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/KycCaseKind' }
        status: { $ref: '#/components/schemas/KycStatus' }
        company: { $ref: '#/components/schemas/KycCompanyData' }
        person: { $ref: '#/components/schemas/KycPersonData' }
        documents:
          type: array
          items: { $ref: '#/components/schemas/KycDocument' }
        decisionReason: { type: string, nullable: true }
        submittedAt: { type: string, format: date-time, nullable: true }
        decidedAt: { type: string, format: date-time, nullable: true }
        updatedAt: { type: string, format: date-time }
    KycDecisionRequest:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approved, rejected]
        reason: { type: string, maxLength: 500 }

    # ---------- accounts
    AccountKind:
      type: string
      enum: [main, project, personal]
    CurrencyBalance:
      type: object
      additionalProperties: false
      required: [currency, posted, held, available]
      properties:
        currency: { $ref: '#/components/schemas/Currency' }
        posted: { $ref: '#/components/schemas/Money' }
        held: { $ref: '#/components/schemas/Money' }
        available: { $ref: '#/components/schemas/Money' }
    Account:
      type: object
      additionalProperties: false
      required: [id, kind, name, archived, erpProjectRef, balances, cvus, createdAt]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/AccountKind' }
        name: { type: string }
        archived: { type: boolean }
        erpProjectRef: { type: string, nullable: true }
        balances:
          type: array
          items: { $ref: '#/components/schemas/CurrencyBalance' }
        cvus:
          type: array
          description: |
            The account's own receiving CVUs (a personal account's ARS and USD CVUs, once the
            person KYC is approved); `[]` when it has none. Payers' CVUs are not listed here.
          items: { $ref: '#/components/schemas/AccountCvu' }
        createdAt: { type: string, format: date-time }
    AccountCvu:
      type: object
      additionalProperties: false
      required: [id, currency, cvu, alias, status, share]
      properties:
        id: { type: string, format: uuid }
        currency: { $ref: '#/components/schemas/Currency' }
        cvu: { type: string, pattern: '^[0-9]{22}$', maxLength: 22 }
        alias: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/CvuStatus' }
        share: { $ref: '#/components/schemas/CvuShare' }
    AccountList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Account' }
    CreateAccountRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
    UpdateAccountRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        archived: { type: boolean }
    AccountBalances:
      type: object
      additionalProperties: false
      required: [accountId, name, kind, balances]
      properties:
        accountId: { type: string, format: uuid }
        name: { type: string }
        kind: { $ref: '#/components/schemas/AccountKind' }
        balances:
          type: array
          items: { $ref: '#/components/schemas/CurrencyBalance' }
    Balances:
      type: object
      additionalProperties: false
      required: [totals, accounts]
      properties:
        totals:
          type: array
          items: { $ref: '#/components/schemas/CurrencyBalance' }
        accounts:
          type: array
          items: { $ref: '#/components/schemas/AccountBalances' }
    InternalTransferRequest:
      type: object
      additionalProperties: false
      required: [fromAccountId, toAccountId, amount]
      properties:
        fromAccountId: { type: string, format: uuid }
        toAccountId: { type: string, format: uuid }
        amount: { $ref: '#/components/schemas/Money' }
        concept: { type: string, maxLength: 140 }
    InternalTransfer:
      type: object
      additionalProperties: false
      required: [id, fromAccountId, toAccountId, amount, concept, createdAt]
      properties:
