        cvu: { type: string, pattern: '^[0-9]{22}$', maxLength: 22 }
        alias: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/CvuStatus' }
        share: { $ref: '#/components/schemas/CvuShare' }
